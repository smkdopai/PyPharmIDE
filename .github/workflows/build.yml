name: Build PyPharm

on:
  push:
    tags: ["v*"]          # push a tag like v1.0.0 to build and publish a Release
  workflow_dispatch:      # or press "Run workflow" on the Actions tab

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/get-runtime.mjs
      - run: python build.py
      - run: cd dist && zip -qr ../PyPharm-web-${{ github.ref_name }}.zip web
      # One upload only (the zip). The other jobs unzip it, so the big
      # Pyodide runtime is no longer stored twice per run.
      - uses: actions/upload-artifact@v4
        with:
          name: out-web
          path: "PyPharm-web-*.zip"
          retention-days: 1       # temporary; the Release keeps the final copy
          compression-level: 0    # already zipped

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, cmd: dist:win }
          - { os: macos-latest,   cmd: dist:mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { name: out-web, path: . }
      - name: Unzip web build
        shell: bash
        run: mkdir -p dist && unzip -q PyPharm-web-*.zip -d dist && rm PyPharm-web-*.zip
      - run: npm install
      - run: npm run ${{ matrix.cmd }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          retention-days: 1
          compression-level: 0

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/download-artifact@v4
        with: { name: out-web, path: . }
      - name: Unzip web build
        run: mkdir -p dist && unzip -q PyPharm-web-*.zip -d dist && rm PyPharm-web-*.zip
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PyPharm-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: out-android
          path: "PyPharm-*.apk"
          retention-days: 1
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: out-*, merge-multiple: true, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**
          body: |
            **PyPharm ${{ github.ref_name }}** — Python for pharmacy students. Python, numpy, pandas, matplotlib, scipy, seaborn, statsmodels, scikit-learn and sympy are built in; no separate Python install and no internet needed.

            | Platform | Download |
            |---|---|
            | Windows | `PyPharm-Setup-*.exe` (installer) or `PyPharm-Portable-*.exe` (no install) |
            | macOS | `PyPharm-*.dmg` — first launch: right-click → Open |
            | Android | `PyPharm-*.apk` — allow "install unknown apps" |
            | Any device / iPhone | Unzip `PyPharm-web-*.zip` onto a website, open it, then *Add to Home Screen* |

            Developed by Dr. S. Selvamuthukumar.
